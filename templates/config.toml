# agy-bridge configuration for this project. Every key is optional.

# collaborative (default): agy has its full toolset — terminal, search, tests — and the
#   executor audits what it delivered. strict: agy has no terminal and anything outside
#   scope is reverted; for sensitive projects.
# mode = "collaborative"

# Verification commands (run by the executor when agy delivers; in collaborative mode agy
# also runs them itself). Without at least one, implement tasks cannot be delegated.
verify = []                 # e.g. ["npm test", "npm run lint"]

# Project paths symlinked into each task's worktree because git does not copy them:
# installed dependencies and local files.
link = []                   # e.g. ["node_modules", ".env"]

# Commands that prepare the worktree before agy starts (an alternative to link).
setup = []                  # e.g. ["npm ci"]

# Commands that normalise agy's code after each turn, before verification.
autofix = []                # e.g. ["npx prettier --write src", "dart format lib test"]

# Extra build artifacts that must never enter a task's diff (git pathspec globs). Python and
# Node caches are already excluded.
artifacts = []              # e.g. ["**/build/**", "**/.dart_tool/**"]

# agy models per role (names from `agy models`; the suffix is the reasoning effort).
# model_implement = "gemini-4-argon-high"
# model_explore   = "gemini-4-hydrogen-high"
# model_review    = "gemini-4-hydrogen-high"   # ideally different from the implementer
# model_grill     = "gemini-4-argon-high"

# Default limits.
# max_fixups = 2            # extra rounds when verification fails, before handing back to Claude
# max_diff_lines = 800      # above this, the task requires reading the diff
# timeout_min = 30          # per agy turn
# verify_timeout_min = 15   # per verification command

# Team skills: skill names (~/.claude/skills/<name>/SKILL.md) or paths to skill files. Claude loads
# them, and agy receives them at the start of every session. Usually set once for all projects in
# ~/.agy-bridge/config.toml; `skills = []` here turns them off for this project.
# skills = ["ponytail"]
