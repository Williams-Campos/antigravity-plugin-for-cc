# agy-bridge configuration for this project. Every key is optional.

# Default verification commands (run by the supervisor, never by agy).
# Without at least one, implement tasks cannot be delegated.
verify = []                 # e.g. ["npm test", "npm run lint"]

# Project paths symlinked into each task's worktree because git does not copy them:
# installed dependencies and local files.
link = []                   # e.g. ["node_modules", ".env"]

# Commands that prepare the worktree before verification (an alternative to link).
setup = []                  # e.g. ["npm ci"]

# Commands that normalise agy's code after each turn, before verification.
# agy has no terminal, so it cannot run the formatter itself.
autofix = []                # e.g. ["npx prettier --write src", "dart format lib test"]

# agy models per role (names from `agy models`).
# model_implement = "gemini-4-hydrogen-high"
# model_explore   = "gemini-4-hydrogen-high"
# model_review    = "gemini-4-argon-high"

# Default limits.
# max_fixups = 2            # automatic fix-up rounds before handing control back to Claude
# max_diff_lines = 800      # above this, the task requires reading the diff
# timeout_min = 30          # per agy turn
# verify_timeout_min = 15   # per verification command
